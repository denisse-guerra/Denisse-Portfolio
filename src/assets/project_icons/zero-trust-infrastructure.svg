<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Outer network layer (DMZ) -->
  <circle cx="100" cy="100" r="75" fill="none" stroke="#FDD5DF" stroke-width="2.5" stroke-dasharray="8,4"/>
  
  <!-- Middle layer (Firewall) -->
  <circle cx="100" cy="100" r="55" fill="none" stroke="#EABEC3" stroke-width="3"/>
  
  <!-- Inner secure layer (Air-gapped vault) -->
  <circle cx="100" cy="100" r="35" fill="#EABEC3" stroke="#C88B95" stroke-width="3"/>
  
  <!-- Lock icon in center -->
  <rect x="90" y="95" width="20" height="18" rx="2" fill="#8B5A65"/>
  <path d="M92 95 L92 88 C92 83 96 80 100 80 C104 80 108 83 108 88 L108 95" 
        fill="none" stroke="#8B5A65" stroke-width="2.5"/>
  <circle cx="100" cy="104" r="2" fill="#FDD5DF"/>
  
  <!-- Network nodes -->
  <circle cx="100" cy="40" r="5" fill="#8B5A65"/>
  <circle cx="145" cy="70" r="5" fill="#8B5A65"/>
  <circle cx="160" cy="100" r="5" fill="#C88B95"/>
  <circle cx="145" cy="130" r="5" fill="#8B5A65"/>
  <circle cx="100" cy="160" r="5" fill="#8B5A65"/>
  <circle cx="55" cy="130" r="5" fill="#8B5A65"/>
  <circle cx="40" cy="100" r="5" fill="#C88B95"/>
  <circle cx="55" cy="70" r="5" fill="#8B5A65"/>
  
  <!-- Connection lines -->
  <line x1="100" y1="65" x2="100" y2="40" stroke="#8B5A65" stroke-width="1.5" opacity="0.5"/>
  <line x1="130" y1="80" x2="145" y2="70" stroke="#8B5A65" stroke-width="1.5" opacity="0.5"/>
</svg>