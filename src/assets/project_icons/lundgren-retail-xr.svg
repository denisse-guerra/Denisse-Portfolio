<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Shopping Cart -->
  <rect x="50" y="80" width="80" height="60" rx="5" fill="none" stroke="#C88B95" stroke-width="3"/>
  <line x1="50" y1="90" x2="130" y2="90" stroke="#C88B95" stroke-width="3"/>
  <circle cx="70" cy="155" r="8" fill="#8B5A65"/>
  <circle cx="110" cy="155" r="8" fill="#8B5A65"/>
  <line x1="40" y1="60" x2="50" y2="80" stroke="#C88B95" stroke-width="3"/>
  
  <!-- VR/AR Elements (floating rectangles) -->
  <rect x="85" y="35" width="30" height="20" rx="3" fill="#EABEC3" stroke="#8B5A65" stroke-width="2"/>
  <rect x="140" y="55" width="25" height="15" rx="3" fill="#FDD5DF" stroke="#8B5A65" stroke-width="1.5"/>
  <rect x="35" y="50" width="20" height="15" rx="3" fill="#FDD5DF" stroke="#8B5A65" stroke-width="1.5"/>
  
  <!-- Connection lines (AR overlay) -->
  <line x1="100" y1="55" x2="90" y2="80" stroke="#8B5A65" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
  <line x1="152" y1="70" x2="110" y2="85" stroke="#8B5A65" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
</svg>