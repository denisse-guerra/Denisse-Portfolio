<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Lock body -->
  <rect x="65" y="95" width="70" height="80" rx="8" fill="#EABEC3" stroke="#C88B95" stroke-width="3"/>
  
  <!-- Lock shackle -->
  <path d="M75 95 L75 70 C75 50 85 40 100 40 C115 40 125 50 125 70 L125 95" 
        fill="none" stroke="#C88B95" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Code/Terminal lines inside lock -->
  <line x1="80" y1="110" x2="110" y2="110" stroke="#8B5A65" stroke-width="2.5"/>
  <line x1="80" y1="125" x2="105" y2="125" stroke="#8B5A65" stroke-width="2.5"/>
  <line x1="80" y1="140" x2="115" y2="140" stroke="#8B5A65" stroke-width="2.5"/>
  <line x1="80" y1="155" x2="95" y2="155" stroke="#8B5A65" stroke-width="2.5"/>
  
  <!-- Key symbol (PKI) -->
  <circle cx="100" cy="130" r="8" fill="#8B5A65"/>
  <line x1="100" y1="138" x2="100" y2="160" stroke="#8B5A65" stroke-width="4"/>
  <line x1="95" y1="150" x2="105" y2="150" stroke="#8B5A65" stroke-width="3"/>
</svg>